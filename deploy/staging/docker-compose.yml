# Static web server for the staging build. Caddy (docker-caddy-1) proxies
# bluestarfish-staging.apps.nebuno.com to this container over the shared
# "caddy" network. Use the full container name in the Caddyfile.
name: bluestarfish-staging

services:
  web:
    image: nginx:1.27-alpine
    container_name: bluestarfish-staging
    restart: unless-stopped
    volumes:
      - ${STAGING_WWW:-/root/docker/volumes/bluestarfish-staging/www}:/srv/www:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - caddy

networks:
  caddy:
    external: true
