# Serves the static staging build the way Netlify serves production.
# Mirrors public/_redirects and Netlify's "Pretty URLs":
#   /        -> 301 /en/
#   /en      -> 301 /en/      (nginx adds the slash for directories)
#   /pl/...  missing -> /pl/404/ with status 404
#   other    missing -> /en/404/ with status 404

server {
    listen 80;
    server_name _;

    root /srv/www/current;
    index index.html;

    # Caddy terminates TLS in front of us. Relative Location headers keep
    # redirects on https and on the public hostname.
    absolute_redirect off;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml text/plain;

    # Staging must never be indexed.
    add_header X-Robots-Tag "noindex, nofollow" always;

    error_page 404 /en/404/index.html;

    location = / {
        return 301 /en/;
    }

    location /pl/ {
        error_page 404 /pl/404/index.html;
    }

    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    location ~* \.html$ {
        add_header Cache-Control "no-cache" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # No dotfiles (e.g. the .commit marker), no Netlify functions or Identity.
    location ~ /\. {
        return 404;
    }

}
